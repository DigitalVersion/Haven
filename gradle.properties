# 8192m (was 6144m, before that 4096m): x64 release bundling OOM'd twice at
# 6G — packageX64FullReleaseBundle died "Java heap space" on v5.87.34 and
# signX64FullReleaseBundle's BundleToolRunnable died silently on v5.87.35,
# both passing armv7+arm64 on the same runs and both passing x64 on a rerun.
# x64 carries the largest native payload, so its AAB is the biggest bundle.
# Earlier, armv7 OOM'd the same way at 4G (#356). ~16G runners / 28G
# workstation leave ample headroom.
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Reuse task outputs (compiled Kotlin, processed resources) across builds.
# In CI the build-cache dir is cached with a rolling key (see
# .github/actions/setup-toolchain) so it accumulates run-to-run, so the four
# heavy jobs stop each recompiling the whole 47-module tree from scratch.
# Cache reuse only substitutes byte-identical outputs, so release
# reproducibility (F-Droid) is unaffected.
org.gradle.caching=true
# Exploit the 47-module graph — modules with no dependency between them
# compile concurrently.
org.gradle.parallel=true
